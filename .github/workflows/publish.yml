name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (optional): leave empty to use pyproject.toml"
        required: false
        type: string
      testpypi:
        description: Publish to TestPyPI
        type: boolean
        default: true
      pypi:
        description: Publish to PyPI, then tag and create the GitHub release
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run from main only (got ${{ github.ref }})"
          exit 1

      - name: Require a target
        if: ${{ !inputs.testpypi && !inputs.pypi }}
        run: |
          echo "::error::Select TestPyPI, PyPI or both"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and tag
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PYPROJECT=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          VERSION="${INPUT_VERSION:-$PYPROJECT}"
          if [ "$VERSION" != "$PYPROJECT" ]; then
            echo "::error::Version mismatch (input=$VERSION pyproject=$PYPROJECT). Bump pyproject.toml on main first."
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    name: Quality checks
    needs: meta
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distributions
    needs: [meta, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: |
          uv build
          uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # Kept out of dist/, which goes to PyPI as is.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pack the Claude Desktop extension
        run: mcpb/pack.sh dist-mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: dist-mcpb/leis-mcp.mcpb
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    if: inputs.testpypi
    needs: [meta, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/leis-mcp/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # A rehearsal run may already have uploaded this version.
      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: Publish to PyPI
    # Runs after TestPyPI when both are selected, and on its own when TestPyPI is unchecked.
    if: >-
      !cancelled() && inputs.pypi
      && needs.build.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.testpypi.result)
    needs: [meta, build, testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/leis-mcp/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Tag and GitHub release
    needs: [meta, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: dist-mcpb/

      - name: Create tag
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*
            dist-mcpb/leis-mcp.mcpb

  registry:
    name: Publish to the MCP Registry
    needs: [meta, release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mcpb
          path: dist-mcpb/

      # The PyPI package is verified through the `mcp-name` line in its README; the extension through its
      # release URL and sha256, added here because both only exist once the release is out.
      - name: Fill in the version and the extension
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          SHA256=$(sha256sum dist-mcpb/leis-mcp.mcpb | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/leis-mcp.mcpb"
          jq --arg v "$VERSION" --arg url "$URL" --arg sha "$SHA256" '
            .version = $v
            | .packages[0].version = $v
            | .packages += [{registryType: "mcpb", identifier: $url, fileSha256: $sha, transport: {type: "stdio"}}]
          ' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
